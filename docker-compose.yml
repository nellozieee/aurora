services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora
    ports:
      - "5432:5432"
    volumes:
      - aurora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aurora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aurora:aurora@postgres:5432/aurora
      REDIS_URL: redis://redis:6379/0
      # Ollama deliberately isn't a service in this compose file (see
      # README's Docker setup section) -- it runs natively on the host for
      # GPU access. From inside this container, "localhost" (.env's default
      # OLLAMA_BASE_URL) means the container itself, not the host, so it
      # must be overridden here to actually reach a host-installed Ollama.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      # host.docker.internal resolves out of the box on Docker Desktop
      # (Windows/Mac); this makes it resolve on native Linux Docker too.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  aurora_postgres_data:
  aurora_redis_data:
